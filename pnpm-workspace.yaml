packages:
  - packages/*
  - '!packages/native-darwin-*'
  - '!packages/native-linux-*'
  - '!packages/native-win32-*'

linkWorkspacePackages: true

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl

ignoredBuiltDependencies:
  - sharp

onlyBuiltDependencies:
  - esbuild
