name: Native Binary Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/native-binary-smoke.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/native-aggregate/**'
      - 'packages/native-*/**'
      - 'packages/stax-xml/package.json'
      - 'packages/stax-xml/src/runtime/**'

permissions:
  contents: read

jobs:
  build:
    # Native OS/variant packages must be packed on the same runner that built them.
    name: ${{ matrix.package_dir }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_dir: native-linux-x64-gnu
            runner: ubuntu-24.04
            rust_target: ''
            install_musl: false
            smoke: true
            glibc_container: true
          - package_dir: native-linux-x64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            install_musl: true
            smoke: false
            glibc_container: false
          - package_dir: native-linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: ''
            install_musl: false
            smoke: true
            glibc_container: true
          - package_dir: native-linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            install_musl: true
            smoke: false
            glibc_container: false
          - package_dir: native-darwin-x64
            runner: macos-15-intel
            rust_target: ''
            install_musl: false
            smoke: true
            glibc_container: false
          - package_dir: native-darwin-arm64
            runner: macos-15
            rust_target: ''
            install_musl: false
            smoke: true
            glibc_container: false
          - package_dir: native-win32-x64-msvc
            runner: windows-2025
            rust_target: ''
            install_musl: false
            smoke: true
            glibc_container: false
          - package_dir: native-win32-arm64-msvc
            runner: windows-11-arm
            rust_target: ''
            install_musl: false
            smoke: true
            glibc_container: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optional

      - name: Install musl toolchain
        if: matrix.install_musl
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Ensure Rust target
        if: ${{ !matrix.glibc_container }}
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add "${{ matrix.rust_target }}"
          fi
          cargo --version

      - name: Build native addon
        shell: bash
        run: |
          if [ "${{ matrix.glibc_container }}" = "true" ]; then
            container_name="stax-xml-glibc-${{ matrix.package_dir }}-${GITHUB_RUN_ID:-local}-$$"
            cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            docker run --name "$container_name" -v "$PWD:/work" -w /work node:20-bullseye bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl build-essential pkg-config python3 git
              corepack enable
              corepack prepare pnpm@10.18.0 --activate
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              export CI=true
              pnpm --dir packages/native-aggregate run build:native
              ldd --version > /tmp/stax-xml-ldd-version.txt 2>&1
              sed -n "1p" /tmp/stax-xml-ldd-version.txt
            '
            docker cp "$container_name:/work/packages/native-aggregate/stax_xml_native_aggregate.node" packages/native-aggregate/stax_xml_native_aggregate.node
            cleanup
            trap - EXIT
            exit 0
          fi
          if [[ "${{ matrix.rust_target }}" == *musl ]]; then
            export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=-crt-static"
          fi
          if [ -n "${{ matrix.rust_target }}" ]; then
            pnpm --dir packages/native-aggregate run build:native -- --target "${{ matrix.rust_target }}"
          else
            pnpm --dir packages/native-aggregate run build:native
          fi

      - name: Smoke native addon
        if: matrix.smoke
        run: pnpm --dir packages/native-aggregate smoke

      - name: Stage platform package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="packages/${{ matrix.package_dir }}"
          pnpm --dir packages/native-aggregate run stage:platform -- "${{ matrix.package_dir }}"
          if [ "${{ matrix.smoke }}" = "true" ]; then
            node packages/native-aggregate/scripts/smoke-platform-package.mjs "$package_dir"
          fi
          node packages/native-aggregate/scripts/assert-pack-contents.mjs "$package_dir"
          mkdir -p "artifacts/${{ matrix.package_dir }}"
          npm pack --json "./$package_dir" --pack-destination "$PWD/artifacts/${{ matrix.package_dir }}"
          cp "$package_dir/package.json" "$package_dir/README.md" "$package_dir/LICENSE" "$package_dir/index.mjs" "$package_dir/stax_xml_native.node" "artifacts/${{ matrix.package_dir }}/"

      - name: Upload binary artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package_dir }}
          path: artifacts/${{ matrix.package_dir }}
          if-no-files-found: error

  wasm:
    # The wasm package is platform-neutral, so packaging on Ubuntu is sufficient.
    name: native-wasm32-wasi
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optional

      - name: Ensure Rust wasm target
        shell: bash
        run: |
          rustup default stable
          rustup target add wasm32-wasip1-threads
          cargo --version

      - name: Build wasm addon
        run: pnpm --dir packages/native-aggregate run build:wasm

      - name: Pack wasm package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          node packages/native-aggregate/scripts/assert-pack-contents.mjs packages/native-wasm32-wasi
          mkdir -p artifacts/native-wasm32-wasi
          npm pack --json ./packages/native-wasm32-wasi --pack-destination "$PWD/artifacts/native-wasm32-wasi" | tee /tmp/stax-xml-wasm-pack.json
          tgz="$(node -e "const fs = require('node:fs'); const path = require('node:path'); const data = JSON.parse(fs.readFileSync('/tmp/stax-xml-wasm-pack.json', 'utf8'))[0]; console.log(path.basename(data.filename));")"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"

      - name: Smoke installed wasm package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stax-xml-wasm-smoke
          mkdir -p /tmp/stax-xml-wasm-smoke
          cd /tmp/stax-xml-wasm-smoke
          npm init -y >/dev/null
          npm install --force "$GITHUB_WORKSPACE/artifacts/native-wasm32-wasi/${{ steps.pack.outputs.tgz }}"
          node --input-type=module <<'NODE'
          import { parseAggregateStringUtf8 } from '@stax-xml/native-wasm32-wasi';

          const result = parseAggregateStringUtf8('<root><item id="1">hello</item></root>', 'count-only');
          const eventCount = result.eventCount ?? result.event_count;
          if (eventCount !== 7) {
            throw new Error(`unexpected wasm event count: ${eventCount}`);
          }
          console.log('wasm package smoke ok');
          NODE

      - name: Upload wasm artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: native-wasm32-wasi
          path: artifacts/native-wasm32-wasi
          if-no-files-found: error
